[package]
name = "rivet-dts"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-dts"
homepage = "https://github.com/safewords/rivet-dts"
documentation = "https://docs.rs/rivet-dts"
authors = ["Ely Erin Fox"]
description = "A DTS Coherent Acoustics decoder (core, XCh, XXCH, X96, XBR, DTS-HD substream) and core encoder in Rust, written from ETSI TS 102 114: no C, no system libraries, no build script. rivet's DTS codec. Imported as `dts`."
keywords = ["dts", "dca", "audio", "decoder", "encoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
exclude = [".github/", "tools/"]

[lib]
name = "dts"

[dependencies]
thiserror = "2"

[features]
default = []
