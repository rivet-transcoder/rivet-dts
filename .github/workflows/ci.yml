name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: ubuntu-latest }
          - { name: linux arm64,    os: ubuntu-24.04-arm }
          - { name: windows x86-64, os: windows-latest }
          - { name: macos arm64,    os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      - name: Tests with overflow checks (debug)
        run: cargo test

  # The decoder is checked against an independent implementation, used only
  # as a black box: ffmpeg makes the test streams and decodes them, and the
  # PCM is compared. Without ffmpeg on PATH those tests skip, so this job
  # installs it and says so if they did not run.
  oracle:
    name: tests against ffmpeg (black box)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Tests
        run: cargo test --release
        env:
          DTS_REQUIRE_FFMPEG: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
