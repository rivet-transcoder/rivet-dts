name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: safewords-runners }
          - { name: linux arm64 under QEMU,    os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      # The portable kernels alone (the run-time AVX2 copies compiled out); they
      # give bit-identical results, so every test must pass unchanged.
      - name: Tests (force-scalar)
        run: cargo test --release --features force-scalar
      - name: Tests with overflow checks (debug)
        run: cargo test

  # The decoder on public DTS, DTS-ES, 96/24, DTS-HD High Resolution and
  # Master Audio streams (tests/samples.rs). They are fetched as data from
  # a public sample archive and checked against their SHA-256; no other
  # implementation is involved. Without the files those tests skip, so this
  # job fetches them and requires them.
  samples:
    name: public sample streams
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: samples
          key: dts-samples-${{ hashFiles('tools/fetch_samples.sh') }}
      - run: bash tools/fetch_samples.sh samples
      - name: Tests
        run: cargo test --release --test samples -- --nocapture
        env:
          DTS_SAMPLES_DIR: samples
          DTS_REQUIRE_SAMPLES: "1"
      - name: Tests (force-scalar)
        run: cargo test --release --features force-scalar --test samples
        env:
          DTS_SAMPLES_DIR: samples
          DTS_REQUIRE_SAMPLES: "1"

  # The decoder against an independent one, libdca's `dcadec` (VideoLAN),
  # run as a black box on this crate's encoder's streams (tests/dcadec.rs).
  # Without the tool those tests skip, so this job installs it and requires it.
  dcadec:
    name: against libdca's dcadec (black box)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdca-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release --test dcadec -- --nocapture
        env:
          DTS_REQUIRE_DCADEC: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features force-scalar -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
